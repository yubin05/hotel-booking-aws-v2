# 로컬 개발용. 아래 비밀번호는 로컬 전용 값이다.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-pw
      MYSQL_DATABASE: hotel_booking
      MYSQL_USER: app
      MYSQL_PASSWORD: local-app-pw
    ports:
      - "3306:3306"
    volumes:
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./app/db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
      - ./app/db/test-db.sh:/docker-entrypoint-initdb.d/3-test-db.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal-root-pw"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: ./app
    environment:
      DB_HOST: db
      DB_PASSWORD: local-app-pw
      JWT_SECRET: local-only-jwt-secret
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
