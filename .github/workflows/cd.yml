name: CD

# 지금은 "빌드 → 서울 ECR push"까지만 (ADR-040). 스키마 태스크 · 서비스 교체(ADR-031, ADR-039)는 ALB · ECS 덩어리 뒤에 붙인다
# 손으로 실행: Actions 탭 → CD → Run workflow (main 브랜치만 배포 역할을 받을 수 있음, ADR-026)
on:
  workflow_dispatch:

permissions:
  id-token: write # OIDC 토큰(신분증) 요청
  contents: read

# 같은 커밋을 두 번 동시에 올리지 않게
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: hotel-booking-aws-v2 # ADR-030

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::248563009287:role/hotel-booking-aws-v2-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 태그는 짧은 커밋 SHA (ADR-022). 저장소가 태그 불변이라 같은 태그를 다시 올리면 실패하므로, 이미 있으면 빌드를 건너뜀
      - name: 이미 올라간 커밋인지 확인
        id: tag
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          FOUND=$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" \
            --query 'length(images)' --output text)
          echo "exists=$([ "$FOUND" = "1" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: 이미지 빌드 · push
        if: steps.tag.outputs.exists != 'true'
        working-directory: app
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: 결과
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
        run: |
          if [ "${{ steps.tag.outputs.exists }}" = "true" ]; then
            echo "이미 있어 건너뜀: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "올림: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          fi
