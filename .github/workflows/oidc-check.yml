name: OIDC check

# GitHub OIDC 역할을 받는지 손으로 확인 (Actions 탭 → OIDC check → Run workflow)
# get-caller-identity는 권한이 필요 없어서, 권한 정책이 없는 역할로도 확인할 수 있다
on:
  workflow_dispatch:

permissions:
  id-token: write # OIDC 토큰(신분증) 요청
  contents: read

jobs:
  assume-role:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::248563009287:role/hotel-booking-aws-v2-github-deploy
          aws-region: ap-northeast-2
      - run: aws sts get-caller-identity
