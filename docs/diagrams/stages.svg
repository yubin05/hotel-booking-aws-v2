<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 778" width="640" height="778" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<title id="t">v2 AWS 이관·부하·장애·DR 0~5단계 실험 수행 완료</title>
<desc id="d">0 로컬 앱 검증 (Docker Compose) (완료): 로컬 장애·부하 6종, 앱 결함과 정합성 검증, 이중 예약·쿠폰 교착·DB 장애 처리 수정 / 1 AWS 이전 환경 부하 기준선 (완료): 동시 500명까지 견디고 1,000명부터 장애, 3회 재현, DB 병목과 오류율 실측 / 1.5 DB 병목 분석·개선 (완료): 같은 옛 환경에서 1,000명 오류율 64 → 1.5%, 조회·연결 풀 개선, 앱 효과 따로 확인 / 2 AWS 목표 인프라·CD (완료): CloudFront·ALB·ECS·RDS와 자동 배포 구축, Terraform 재현성과 예약 스케일링 검증 / 3 덤프 이관·성능·쿠폰 실측 (완료): 12개 테이블·176,073행 체크섬 일치, 3,000명 부하 3회·쿠폰 2대/4대 각 3회 / 4 AWS 장애 주입 드릴 (완료): 태스크·깨진 배포·RDS·AZ 장애 주입 완료, AZ 오류율 14.6% 원인 분석은 후속 / 5 서울→도쿄 DR · Failback (완료): 실험 실행 완료(사용자 확인), RTO/RPO·오류율 최종 집계는 후속 정리</desc>
<rect width="640" height="778" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="24" y="32" font-size="18" font-weight="700" fill="#1f2328">v2 단계별 검증 · 실행 완료</text>
<line x1="36" y1="110" x2="36" y2="696" stroke="#1a7f37" stroke-width="3"/>
<text x="68" y="58" font-size="12.5" font-weight="600" fill="#0969da">로컬 — 앱 결함을 0원으로 먼저 없앰</text>
<text x="68" y="174" font-size="12.5" font-weight="600" fill="#0969da">AWS — 같은 실험으로 인프라 성능과 복구 확인</text>
<rect x="68" y="70" width="552" height="80" rx="10" fill="#f0fff4" stroke="#1a7f37" stroke-width="1.5"/>
<circle cx="36" cy="110" r="15" fill="#1a7f37" stroke="#1a7f37" stroke-width="2"/>
<text x="36" y="115" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">0</text>
<text x="86" y="98" font-size="15.5" font-weight="700" fill="#1f2328">로컬 앱 검증 (Docker Compose)</text>
<text x="604" y="98" font-size="14" font-weight="700" text-anchor="end" fill="#1f2328">$0</text>
<text x="604" y="120" font-size="12" font-weight="600" text-anchor="end" fill="#1a7f37">완료</text>
<text x="86" y="121" font-size="13" fill="#57606a">로컬 장애·부하 6종, 앱 결함과 정합성 검증</text>
<text x="86" y="139" font-size="13" fill="#57606a">이중 예약·쿠폰 교착·DB 장애 처리 수정</text>
<rect x="68" y="186" width="552" height="80" rx="10" fill="#f0fff4" stroke="#1a7f37" stroke-width="1.5"/>
<circle cx="36" cy="226" r="15" fill="#1a7f37" stroke="#1a7f37" stroke-width="2"/>
<text x="36" y="231" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="86" y="214" font-size="15.5" font-weight="700" fill="#1f2328">AWS 이전 환경 부하 기준선</text>
<text x="604" y="214" font-size="14" font-weight="700" text-anchor="end" fill="#1f2328">약 $10</text>
<text x="604" y="236" font-size="12" font-weight="600" text-anchor="end" fill="#1a7f37">완료</text>
<text x="86" y="237" font-size="13" fill="#57606a">동시 500명까지 견디고 1,000명부터 장애</text>
<text x="86" y="255" font-size="13" fill="#57606a">3회 재현, DB 병목과 오류율 실측</text>
<rect x="68" y="280" width="552" height="80" rx="10" fill="#f0fff4" stroke="#1a7f37" stroke-width="1.5"/>
<circle cx="36" cy="320" r="15" fill="#1a7f37" stroke="#1a7f37" stroke-width="2"/>
<text x="36" y="325" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">1.5</text>
<text x="86" y="308" font-size="15.5" font-weight="700" fill="#1f2328">DB 병목 분석·개선</text>
<text x="604" y="308" font-size="14" font-weight="700" text-anchor="end" fill="#1f2328">$0</text>
<text x="604" y="330" font-size="12" font-weight="600" text-anchor="end" fill="#1a7f37">완료</text>
<text x="86" y="331" font-size="13" fill="#57606a">같은 옛 환경에서 1,000명 오류율 64 → 1.5%</text>
<text x="86" y="349" font-size="13" fill="#57606a">조회·연결 풀 개선, 앱 효과 따로 확인</text>
<rect x="68" y="374" width="552" height="80" rx="10" fill="#f0fff4" stroke="#1a7f37" stroke-width="1.5"/>
<circle cx="36" cy="414" r="15" fill="#1a7f37" stroke="#1a7f37" stroke-width="2"/>
<text x="36" y="419" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="86" y="402" font-size="15.5" font-weight="700" fill="#1f2328">AWS 목표 인프라·CD</text>
<text x="604" y="402" font-size="14" font-weight="700" text-anchor="end" fill="#1f2328">약 $42</text>
<text x="604" y="424" font-size="12" font-weight="600" text-anchor="end" fill="#1a7f37">완료</text>
<text x="86" y="425" font-size="13" fill="#57606a">CloudFront·ALB·ECS·RDS와 자동 배포 구축</text>
<text x="86" y="443" font-size="13" fill="#57606a">Terraform 재현성과 예약 스케일링 검증</text>
<rect x="68" y="468" width="552" height="80" rx="10" fill="#f0fff4" stroke="#1a7f37" stroke-width="1.5"/>
<circle cx="36" cy="508" r="15" fill="#1a7f37" stroke="#1a7f37" stroke-width="2"/>
<text x="36" y="513" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="86" y="496" font-size="15.5" font-weight="700" fill="#1f2328">덤프 이관·성능·쿠폰 실측</text>
<text x="604" y="496" font-size="14" font-weight="700" text-anchor="end" fill="#1f2328">+ 부하</text>
<text x="604" y="518" font-size="12" font-weight="600" text-anchor="end" fill="#1a7f37">완료</text>
<text x="86" y="519" font-size="13" fill="#57606a">12개 테이블·176,073행 체크섬 일치</text>
<text x="86" y="537" font-size="13" fill="#57606a">3,000명 부하 3회·쿠폰 2대/4대 각 3회</text>
<rect x="68" y="562" width="552" height="80" rx="10" fill="#f0fff4" stroke="#1a7f37" stroke-width="1.5"/>
<circle cx="36" cy="602" r="15" fill="#1a7f37" stroke="#1a7f37" stroke-width="2"/>
<text x="36" y="607" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="86" y="590" font-size="15.5" font-weight="700" fill="#1f2328">AWS 장애 주입 드릴</text>
<text x="604" y="590" font-size="14" font-weight="700" text-anchor="end" fill="#1f2328">+ Multi-AZ</text>
<text x="604" y="612" font-size="12" font-weight="600" text-anchor="end" fill="#1a7f37">완료</text>
<text x="86" y="613" font-size="13" fill="#57606a">태스크·깨진 배포·RDS·AZ 장애 주입 완료</text>
<text x="86" y="631" font-size="13" fill="#57606a">AZ 오류율 14.6% 원인 분석은 후속</text>
<rect x="68" y="656" width="552" height="80" rx="10" fill="#f0fff4" stroke="#1a7f37" stroke-width="1.5"/>
<circle cx="36" cy="696" r="15" fill="#1a7f37" stroke="#1a7f37" stroke-width="2"/>
<text x="36" y="701" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<text x="86" y="684" font-size="15.5" font-weight="700" fill="#1f2328">서울→도쿄 DR · Failback</text>
<text x="604" y="684" font-size="14" font-weight="700" text-anchor="end" fill="#1f2328">+ DR 시간</text>
<text x="604" y="706" font-size="12" font-weight="600" text-anchor="end" fill="#1a7f37">완료</text>
<text x="86" y="707" font-size="13" fill="#57606a">실험 실행 완료(사용자 확인)</text>
<text x="86" y="725" font-size="13" fill="#57606a">RTO/RPO·오류율 최종 집계는 후속 정리</text>
<text x="68" y="756" font-size="12" fill="#57606a">실험 수행 완료 · 4·5단계 실패율·RTO/RPO 최종 보정은 후속</text>
</svg>
